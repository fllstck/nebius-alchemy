name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.13'

jobs:
  check:
    name: Check (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # schemas/ is gitignored (generated via buf from nebius/api) — must be
      # regenerated on a fresh checkout before tsc/effect-tsgo can resolve imports.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.71.0'
      - name: Generate schemas
        run: bun run generate:schemas
      - name: Typecheck + lint
        run: bun run check

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # schemas/ is gitignored (generated via buf from nebius/api) — must be
      # regenerated on a fresh checkout before tests can import generated clients.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.71.0'
      - name: Generate schemas
        run: bun run generate:schemas
      # Network-free by design — integration tests gate behind SLOW_TESTS=1
      # (see tests/helpers/gate.ts); this job intentionally never sets it.
      - name: Unit tests
        run: bun test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Informational: prints the full report including the known baseline
      # (40 transitive vulns via pinned alchemy tooling — tracked, not chased).
      - name: Full audit report
        run: bun audit
        continue-on-error: true
      # Hard gate: fail on any NEW critical-severity advisory. 0 criticals
      # in the baseline, so this only trips on genuinely dangerous findings.
      - name: Fail on critical advisories
        run: bun audit --audit-level=critical

  smoke-test:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # schemas/ is gitignored (generated via buf from nebius/api) — the
      # tarball must contain it, so generate before packing.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.71.0'
      - name: Generate schemas
        run: bun run generate:schemas
      - name: Pack tarball
        run: echo "TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)" >> "$GITHUB_ENV"
      - name: Install tarball into scratch project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          # Mirror the overrides the README tells consumers they MUST add.
          # Without them the package cannot be imported at all: a prerelease
          # caret pulls @effect/platform-node-shared@rc.113, which imports
          # `effect/ByteSize` — absent from the rc.112 the consumer installed.
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.overrides={
              '@effect/platform-node-shared':'4.0.0-rc.112',
              '@effect/sql-d1':'4.0.0-rc.112',
              '@effect/sql-sqlite-do':'4.0.0-rc.112',
              '@effect/vitest':'4.0.0-rc.112',
            };
            fs.writeFileSync('package.json', JSON.stringify(p,null,2));
          "
          npm install "$RUNNER_TEMP/$TARBALL" \
            effect@4.0.0-rc.112 \
            @effect/platform-bun@4.0.0-rc.112 \
            @effect/platform-node@4.0.0-rc.112 \
            typescript@7
      - name: Compile README quick-start
        run: |
          cd "$RUNNER_TEMP/consumer"
          cp "$GITHUB_WORKSPACE/.github/smoke/smoke.ts" .
          cp "$GITHUB_WORKSPACE/.github/smoke/tsconfig.json" .
          ./node_modules/.bin/tsc --noEmit
      # `tsc` above proves only that the TYPES resolve. With `skipLibCheck` it
      # never resolves runtime imports, so it structurally CANNOT catch a broken
      # transitive dependency — exactly the failure that shipped past the first
      # version of this job (a prerelease caret drifting to a shared package
      # importing a subpath missing from the pinned `effect`). Actually
      # importing does, and it fails at load rather than at typecheck.
      # Bun is used purely as a TS-capable runtime; the install above is npm.
      - name: Import the package for real (catches broken transitive deps)
        run: |
          cd "$RUNNER_TEMP/consumer"
          bun -e "await import('@fllstck/nebius-alchemy'); console.log('import OK')"
          bun -e "await import('alchemy'); console.log('alchemy import OK')"
