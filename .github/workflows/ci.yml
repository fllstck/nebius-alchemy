name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.13'

jobs:
  check:
    name: Check (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # schemas/ is gitignored (generated via buf from nebius/api) — must be
      # regenerated on a fresh checkout before tsc/effect-tsgo can resolve imports.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.71.0'
      - name: Generate schemas
        run: bun run generate:schemas
      - name: Typecheck + lint
        run: bun run check

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # schemas/ is gitignored (generated via buf from nebius/api) — must be
      # regenerated on a fresh checkout before tests can import generated clients.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.71.0'
      - name: Generate schemas
        run: bun run generate:schemas
      # Network-free by design — integration tests gate behind SLOW_TESTS=1
      # (see tests/helpers/gate.ts); this job intentionally never sets it.
      - name: Unit tests
        run: bun test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Informational only — and it always looks like a warning. `bun audit`
      # exits 1 whenever ANY advisory exists, so with continue-on-error this step
      # is rendered as a failed-but-allowed step (yellow annotation) on every
      # run. That is expected, not a regression; the gate below is what decides
      # the job.
      #
      # Baseline 2026-09-10: 47 transitive advisories — 5 high, 39 moderate,
      # 3 low — and **none of them is in our own dependency list**. They all
      # arrive through alchemy's dependency graph: `@prisma/dev` pins
      # `hono@4.11.4` and `@hono/node-server@1.19.9` *exactly* (both vulnerable,
      # so no range bump can resolve them), plus lodash, nanoid, valibot and
      # vitest/@vitest/mocker from its dev tooling. Tracked, not chased: none is
      # reachable from this package's code paths and we cannot ship an
      # `overrides` fix to consumers (dependency overrides are ignored).
      # Re-measured after the 2026-09-18 beta.79/rc.115 bump: still 47, still all
      # `hono` via `@prisma/dev`. Expect the total to drift upward as advisories
      # are published against those pinned versions — the gate below is what
      # matters, and it stays at 0 criticals.
      - name: Full audit report
        run: bun audit
        continue-on-error: true
      # Hard gate: fail on any NEW critical-severity advisory. 0 criticals
      # in the baseline, so this only trips on genuinely dangerous findings.
      - name: Fail on critical advisories
        run: bun audit --audit-level=critical

  smoke-test:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # schemas/ is gitignored (generated via buf from nebius/api) — the
      # tarball must contain it, so generate before packing.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.71.0'
      - name: Generate schemas
        run: bun run generate:schemas
      - name: Pack tarball
        run: echo "TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)" >> "$GITHUB_ENV"
      # The two installers are not equivalent and neither is redundant:
      #   npm — enforces the exact `@effect/platform-node-shared` peer, so the
      #         tree is correct with NO consumer configuration.
      #   bun — ignores peer version ranges, so a drifted shared package is
      #         installed silently and only the import fails. This is the path
      #         that broke 0.7.0, and it was previously untested: installing with
      #         bun is the documented consumer workflow, and `<cli> install`
      #         exiting 0 proves nothing about what it resolved.
      # Both run WITHOUT overrides — a consumer must need none. That is now true
      # for both installers (effect rc.113+ keeps the whole `@effect/*` family on
      # one release), and it is asserted here rather than assumed.
      - name: Install tarball + import (npm, no overrides)
        run: bash .github/smoke/consumer.sh npm "$RUNNER_TEMP/consumer-npm" "$RUNNER_TEMP/$TARBALL"
      - name: Install tarball + import (bun, no overrides)
        run: bash .github/smoke/consumer.sh bun "$RUNNER_TEMP/consumer-bun" "$RUNNER_TEMP/$TARBALL"
