name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.13'

jobs:
  check:
    name: Check (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # schemas/ is gitignored (generated via buf from nebius/api) — must be
      # regenerated on a fresh checkout before tsc/effect-tsgo can resolve imports.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.71.0'
      - name: Generate schemas
        run: bun run generate:schemas
      - name: Typecheck + lint
        run: bun run check

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # schemas/ is gitignored (generated via buf from nebius/api) — must be
      # regenerated on a fresh checkout before tests can import generated clients.
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.71.0'
      - name: Generate schemas
        run: bun run generate:schemas
      # Network-free by design — integration tests gate behind SLOW_TESTS=1
      # (see tests/helpers/gate.ts); this job intentionally never sets it.
      - name: Unit tests
        run: bun test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Informational: prints the full report including the known baseline
      # (40 transitive vulns via pinned alchemy tooling — tracked, not chased).
      - name: Full audit report
        run: bun audit
        continue-on-error: true
      # Hard gate: fail on any NEW critical-severity advisory. 0 criticals
      # in the baseline, so this only trips on genuinely dangerous findings.
      - name: Fail on critical advisories
        run: bun audit --audit-level=critical
